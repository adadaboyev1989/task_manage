<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Topshiriqlar nazorati</title>
  <script>
    try {
      var t = localStorage.getItem('theme-preference');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2451B4" />
  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img src="/icons/icon-192.png" alt="logo" />
      <span id="brand-title">Topshiriqlar</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px">
      <a class="btn secondary small hidden" id="link-admin" href="/admin/">⚙️ Admin panel</a>
      <button class="btn ghost small" id="btn-theme" title="Mavzuni almashtirish">🌙</button>
      <button class="btn ghost small" onclick="location.reload()" title="Sahifani yangilash">🔄</button>
      <button class="btn ghost small" id="btn-notify" title="Bildirishnomalarni yoqish">🔔</button>
      <span class="user-chip" id="user-chip"></span>
      <button class="btn secondary small" id="btn-logout">Chiqish</button>
    </div>
  </div>

  <div class="container" id="app">
    <div class="empty-state">Yuklanmoqda...</div>
  </div>

  <button class="btn fab-install hidden" id="btn-install">⬇️ Ilova sifatida o'rnatish</button>

  <div id="modal-root"></div>

  <script src="/js/pwa.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
